<title>Sorting Station Simulator v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  /* Layout: sticky control deck (toolbar, live schematic, operator side panel, state chips) above a scrolling grid of state diagrams */
  :root {
    --bg: #f3f5f6; --sheet: #ffffff; --ink: #1f2b33; --muted: #5c6b75; --rule: #d3dade;
    --belt: #c9d1d6; --sensor: #0f7f8c; --sensor-tint: #e0f2f4; --act: #b86a00; --act-tint: #fbefdc;
    --red: #d1453b; --blue: #2f6fd0; --white: #fbfbf8; --hl: #c9ecef;
    --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12181c; --sheet: #182127; --ink: #dfe7ec; --muted: #94a3ad; --rule: #2e3a42;
    --belt: #34424b; --sensor: #4cc3d0; --sensor-tint: #143238; --act: #f0a640; --act-tint: #3a2a12;
    --red: #e8665c; --blue: #5d93ea; --white: #e9ebe6; --hl: #1d4a50; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #12181c; --sheet: #182127; --ink: #dfe7ec; --muted: #94a3ad; --rule: #2e3a42;
    --belt: #34424b; --sensor: #4cc3d0; --sensor-tint: #143238; --act: #f0a640; --act-tint: #3a2a12;
    --red: #e8665c; --blue: #5d93ea; --white: #e9ebe6; --hl: #1d4a50; color-scheme: dark }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .wrap { max-width: 1500px; margin: 0 auto; }
  .deck { background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--rule); display: grid; gap: 10px; z-index: 5; }
  @media (min-width: 1000px) and (min-height: 760px) { .deck { position: sticky; top: env(safe-area-inset-top, 0px); } }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  h1 { font-size: 1.25rem; margin: 0; text-wrap: balance; }
  .ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select { font: inherit; font-size: 13px; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--sensor); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 6.5em; font-weight: 600; }
  label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  #clock { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 8em; }
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 12px; align-items: start; }
  @media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }
  .sch { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto; display: flex; justify-content: center; }
  .sch svg { display: block; width: 100%; height: auto; max-height: 40vh; min-width: 560px; }
  .side { display: grid; gap: 10px; min-width: 0; }
  .grp { display: grid; gap: 6px; }
  .grp h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .btns button { padding: 5px 4px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--ink); margin-right: 5px; vertical-align: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 12px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; background: var(--sheet); }
  .chip b { font-family: var(--sans); font-weight: 600; margin-right: 6px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 14px; }
  @media (min-width: 1150px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px 12px; display: grid; gap: 6px; min-width: 0; align-content: start; }
  .card h2 { font-size: 14px; margin: 0; display: flex; justify-content: space-between; gap: 8px; }
  .card h2 span { font-family: var(--mono); font-weight: 400; font-size: 12px; color: var(--muted); }
  .dg { overflow-x: auto; }
  .dg svg { display: block; width: 100%; height: auto; min-width: 480px; }
  .dg.small svg { max-width: 460px; min-width: 380px; margin: 0 auto; }
  /* live state highlighting inside the diagrams */
  .state > rect, .state > text, .trans path, .trans text, .trans rect { transition: fill .5s, stroke .5s, stroke-width .5s; }
  .state.active > rect { fill: var(--hl); stroke: var(--sensor); stroke-width: 3.2; }
  .trans.flash path { stroke: var(--act); stroke-width: 3.5; }
  .trans.flash path.ah, .trans.flash path.ahc { fill: var(--act); stroke-width: 1; }
  .trans.flash text { fill: var(--act); font-weight: 600; }
  .trans.flash rect { stroke: var(--act); stroke-width: 2.5; }
  @media (prefers-reduced-motion: reduce) { .state > rect, .trans path, .trans text { transition: none; } }
</style>

<div class="wrap">
  <div class="deck">
    <div class="bar">
      <h1>Sorting Station Simulator</h1>
      <div class="ctrl">
        <button id="play" class="primary">▶ Start</button>
        <button id="next" title="Run until the next state transition">Next transition</button>
        <button id="reset" title="Switch the machine off and on again">Reset</button>
        <label for="speed">Speed
          <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </label>
        <label><input type="checkbox" id="demo" checked> Demo operator</label>
        <span id="clock">t = 0.00 s</span>
      </div>
    </div>
    <div class="stage">
      <div class="sch">{{schematic}}</div>
      <aside class="side">
        <div class="grp">
          <h2>Place a part at the entry</h2>
          <div class="btns">
            <button data-part="red"><span class="sw" style="background:var(--red)"></span>Red</button>
            <button data-part="blue"><span class="sw" style="background:var(--blue)"></span>Blue</button>
            <button data-part="white"><span class="sw" style="background:var(--white)"></span>White</button>
          </div>
          <p class="hint">One part at a time: the buttons work while the sorter waits in WaitPart.</p>
        </div>
      </aside>
    </div>
    <div id="chips" class="chips" aria-live="polite"></div>
  </div>

  <div class="grid">
    <section class="card"><h2>Sorter <span>B1 · photoSensor · B3 B4</span></h2><div class="dg">{{sorter}}</div></section>
    <section class="card"><h2>Conveyor <span>belt</span></h2><div class="dg small">{{conveyor}}</div></section>
    <section class="card"><h2>Ejector 1 <span>valve1 · S1 S2</span></h2><div class="dg">{{ej1}}</div></section>
    <section class="card"><h2>Ejector 2 <span>valve2 · S3 S4</span></h2><div class="dg">{{ej2}}</div></section>
  </div>
</div>

<script>
{{script}}
</script>
